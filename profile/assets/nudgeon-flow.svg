<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Nudgeon product flow</title>
  <desc id="desc">Four stages: events, audiences, journeys, and delivery.</desc>
  <defs>
    <linearGradient id="surface" x1="40" y1="20" x2="960" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D2C43" />
      <stop offset="1" stop-color="#071522" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#55D8E6" />
      <stop offset="1" stop-color="#4E7BFF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020B12" flood-opacity="0.28" />
    </filter>
  </defs>
  <rect x="8" y="8" width="984" height="584" rx="42" fill="url(#surface)" stroke="#234B62" stroke-width="2" />
  <circle cx="898" cy="36" r="166" fill="#168AAD" opacity="0.08" />
  <circle cx="84" cy="574" r="142" fill="#4E7BFF" opacity="0.07" />

  <g filter="url(#shadow)">
    <rect x="54" y="54" width="420" height="218" rx="28" fill="#12364D" stroke="#1E536C" />
    <rect x="526" y="54" width="420" height="218" rx="28" fill="#102E46" stroke="#1B4A65" />
    <rect x="54" y="328" width="420" height="218" rx="28" fill="#102E46" stroke="#1B4A65" />
    <rect x="526" y="328" width="420" height="218" rx="28" fill="#0A2032" stroke="#28637B" />
  </g>

  <rect x="54" y="54" width="8" height="218" rx="4" fill="#55D8E6" />
  <rect x="526" y="54" width="8" height="218" rx="4" fill="#4E7BFF" />
  <rect x="54" y="328" width="8" height="218" rx="4" fill="#32C596" />
  <rect x="526" y="328" width="8" height="218" rx="4" fill="url(#accent)" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="92" y="103" fill="#55D8E6" font-size="18" font-weight="700" letter-spacing="2">01</text>
    <text x="92" y="169" fill="#F5FBFD" font-size="36" font-weight="760">Events</text>
    <text x="92" y="212" fill="#A9C5D0" font-size="22">SDK + server signals</text>

    <text x="564" y="103" fill="#829FFF" font-size="18" font-weight="700" letter-spacing="2">02</text>
    <text x="564" y="169" fill="#F5FBFD" font-size="36" font-weight="760">Audiences</text>
    <text x="564" y="212" fill="#A9C5D0" font-size="22">Profiles + segments</text>

    <text x="92" y="377" fill="#54D6A8" font-size="18" font-weight="700" letter-spacing="2">03</text>
    <text x="92" y="443" fill="#F5FBFD" font-size="36" font-weight="760">Journeys</text>
    <text x="92" y="486" fill="#A9C5D0" font-size="22">Triggers + decisions</text>

    <text x="564" y="377" fill="#55D8E6" font-size="18" font-weight="700" letter-spacing="2">04</text>
    <text x="564" y="443" fill="#F5FBFD" font-size="36" font-weight="760">Delivery</text>
    <text x="564" y="486" fill="#A9C5D0" font-size="22">Push-first channels</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <circle cx="414" cy="105" r="24" stroke="#55D8E6" opacity="0.9" />
    <path d="M404 105H424M414 95V115" stroke="#55D8E6" />
    <circle cx="886" cy="105" r="24" stroke="#829FFF" opacity="0.9" />
    <circle cx="878" cy="101" r="5" fill="#829FFF" stroke="none" />
    <circle cx="892" cy="110" r="5" fill="#829FFF" stroke="none" />
    <circle cx="414" cy="379" r="24" stroke="#54D6A8" opacity="0.9" />
    <path d="M402 386L412 374L420 382L428 371" stroke="#54D6A8" />
    <circle cx="886" cy="379" r="24" stroke="#55D8E6" opacity="0.9" />
    <path d="M874 380L883 389L899 369" stroke="#55D8E6" />
  </g>
